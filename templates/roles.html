<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Roles - Legal Contract System</title>

    <link rel="stylesheet" href="/static/style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        /* SIDEBAR */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 250px;
            height: 100vh;
            background: #172033;
            color: white;
            z-index: 1000;
        }

        .sidebar-header {
            padding: 20px;
        }

        .sidebar-header h2 {
            margin: 0;
            font-size: 22px;
            color: white;
        }

        .sidebar-header p {
            margin: 5px 0 0;
            color: #d1d5db;
            font-size: 14px;
        }

        .sidebar-menu {
            list-style: none;
            padding: 0;
            margin: 10px 0 0;
        }

        .sidebar-menu li {
            margin: 0;
            padding: 0;
        }

        .sidebar-menu li a {
            display: block;
            padding: 12px 20px;
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        .sidebar-menu li a:hover {
            background: rgba(255, 255, 255, 0.10);
            color: white;
        }

        .sidebar-menu li.active a {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            font-weight: 600;
        }

        .sidebar-bottom {
            position: absolute;
            bottom: 20px;
            left: 15px;
            right: 15px;
        }

        .sidebar-bottom button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            background: #dc2626;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        .sidebar-bottom button:hover {
            background: #b91c1c;
        }

        /* MAIN */

        .main-content {
            margin-left: 250px;
            min-height: 100vh;
        }

        .topbar {
            background: white;
            padding: 18px 30px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .topbar h1 {
            margin: 0;
            font-size: 24px;
        }

        .user-info {
            text-align: right;
        }

        .user-info strong {
            display: block;
        }

        .user-info span {
            color: #6b7280;
            font-size: 13px;
        }

        .content {
            padding: 30px;
        }

        /* PAGE HEADER */

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .page-header h2 {
            margin: 0;
        }

        .page-header p {
            margin: 6px 0 0;
            color: #6b7280;
        }

        /* BUTTONS */

        .btn {
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-edit {
            background: #f59e0b;
            color: white;
            padding: 7px 12px;
        }

        .btn-delete {
            background: #dc2626;
            color: white;
            padding: 7px 12px;
            margin-left: 5px;
        }

        .btn-cancel {
            background: #6b7280;
            color: white;
        }

        /* TABLE */

        .table-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 13px 12px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
        }

        th {
            background: #f8fafc;
            font-size: 14px;
        }

        td {
            font-size: 14px;
        }

        .empty-message {
            text-align: center;
            padding: 30px;
            color: #6b7280;
        }

        /* MESSAGE */

        .message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        /* MODAL */

        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.45);
        }

        .modal-content {
            background: white;
            width: 420px;
            max-width: 90%;
            margin: 100px auto;
            padding: 25px;
            border-radius: 10px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            margin: 0;
        }

        .close {
            font-size: 25px;
            cursor: pointer;
            color: #6b7280;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #2563eb;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

    <div class="sidebar-header">
        <h2>Legal Contract</h2>
        <p>Document System</p>
    </div>

    <ul class="sidebar-menu">

        <li>
            <a href="/dashboard">Dashboard</a>
        </li>

        <li>
            <a href="/contracts-page">Contracts</a>
        </li>

        <li>
            <a href="/documents-page">Documents</a>
        </li>

        <li id="usersMenu">
            <a href="/users-page">Users</a>
        </li>

        <li class="active">
            <a href="/roles-page">Roles</a>
        </li>

        <li id="approvalMenu">
            <a href="#">Approval</a>
        </li>

    </ul>

    <div class="sidebar-bottom">
        <button onclick="logout()">Logout</button>
    </div>

</div>


<!-- MAIN CONTENT -->

<div class="main-content">

    <div class="topbar">

        <div>
            <h1>Role Management</h1>
        </div>

        <div class="user-info">
            <strong id="loggedUsername">User</strong>
            <span id="loggedRole">Role</span>
        </div>

    </div>


    <div class="content">

        <div class="page-header">

            <div>
                <h2>Roles</h2>
                <p>Manage system roles and permissions.</p>
            </div>

            <button
                class="btn btn-primary"
                onclick="openCreateModal()">
                + Create Role
            </button>

        </div>


        <div id="message" class="message"></div>


        <div class="table-card">

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Role Name</th>
                        <th>Actions</th>
                    </tr>

                </thead>

                <tbody id="rolesTableBody">

                    <tr>
                        <td colspan="3"
                            class="empty-message">
                            Loading roles...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>


<!-- CREATE / EDIT MODAL -->

<div id="roleModal" class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h2 id="modalTitle">Create Role</h2>

            <span
                class="close"
                onclick="closeModal()">
                &times;
            </span>

        </div>


        <form id="roleForm">

            <div class="form-group">

                <label>Role Name</label>

                <input
                    type="text"
                    id="roleName"
                    placeholder="Enter role name"
                    required>

            </div>


            <div class="form-actions">

                <button
                    type="button"
                    class="btn btn-cancel"
                    onclick="closeModal()">
                    Cancel
                </button>

                <button
                    type="submit"
                    class="btn btn-primary">
                    Save Role
                </button>

            </div>

        </form>

    </div>

</div>


<script>

    /* ==============================
       LOGIN CHECK
    ============================== */

    const token =
        localStorage.getItem("access_token");

    if (!token) {

        window.location.href = "/login";

    }


    /* ==============================
       USER INFO
    ============================== */

    const username =
        localStorage.getItem("username") || "User";

    const roleId =
        Number(localStorage.getItem("role_id"));


    const roleNames = {

        2: "Admin",
        3: "Approval",
        4: "Role Management",
        5: "Reviewer"

    };


    document.getElementById(
        "loggedUsername"
    ).textContent = username;


    document.getElementById(
        "loggedRole"
    ).textContent =
        roleNames[roleId] || "Role";


    /* ==============================
       ACCESS CONTROL
    ============================== */

    if (roleId !== 2 && roleId !== 4) {

        alert(
            "Access denied. Only Admin and Role Management can access Roles."
        );

        window.location.href =
            "/dashboard";

    }


    /* ==============================
       SIDEBAR
    ============================== */

    const usersMenu =
        document.getElementById("usersMenu");

    const approvalMenu =
        document.getElementById("approvalMenu");


    if (roleId === 2 || roleId === 4) {

        usersMenu.innerHTML =
            '<a href="/users-page">Users</a>';

    }


    if (roleId === 2 || roleId === 3) {

        approvalMenu.innerHTML =
            '<a href="/approval-page">Approval</a>';

    }


    /* ==============================
       API REQUEST
    ============================== */

    async function apiRequest(
        url,
        options = {}
    ) {

        options.headers = {

            "Content-Type":
                "application/json",

            "Authorization":
                "Bearer " + token,

            ...(options.headers || {})

        };


        const response =
            await fetch(url, options);


        if (response.status === 401) {

            localStorage.clear();

            window.location.href =
                "/login";

            return null;

        }


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.detail ||
                "Something went wrong"
            );

        }


        return data;

    }


    /* ==============================
       LOAD ROLES
    ============================== */

    async function loadRoles() {

        const tableBody =
            document.getElementById(
                "rolesTableBody"
            );


        try {

            const roles =
                await apiRequest("/roles/");


            tableBody.innerHTML = "";


            if (!roles ||
                roles.length === 0) {

                tableBody.innerHTML = `

                    <tr>

                        <td
                            colspan="3"
                            class="empty-message">

                            No roles found.

                        </td>

                    </tr>

                `;

                return;

            }


            roles.forEach(role => {

                tableBody.innerHTML += `

                    <tr>

                        <td>
                            ${role.id}
                        </td>

                        <td>
                            ${role.name}
                        </td>

                        <td>

                            <button
                                class="btn btn-edit"
                                onclick='editRole(${JSON.stringify(role)})'>

                                Edit

                            </button>


                            <button
                                class="btn btn-delete"
                                onclick="deleteRole(${role.id})">

                                Delete

                            </button>

                        </td>

                    </tr>

                `;

            });

        }

        catch (error) {

            showMessage(
                error.message,
                "error"
            );

        }

    }


    /* ==============================
       CREATE ROLE
    ============================== */

    function openCreateModal() {

        document.getElementById(
            "modalTitle"
        ).textContent =
            "Create Role";


        document.getElementById(
            "roleForm"
        ).reset();


        document.getElementById(
            "roleForm"
        ).dataset.mode =
            "create";


        document.getElementById(
            "roleModal"
        ).style.display =
            "block";

    }


    /* ==============================
       EDIT ROLE
    ============================== */

    function editRole(role) {

        document.getElementById(
            "modalTitle"
        ).textContent =
            "Edit Role";


        document.getElementById(
            "roleName"
        ).value =
            role.name;


        document.getElementById(
            "roleForm"
        ).dataset.mode =
            "edit";


        document.getElementById(
            "roleForm"
        ).dataset.roleId =
            role.id;


        document.getElementById(
            "roleModal"
        ).style.display =
            "block";

    }


    /* ==============================
       CLOSE MODAL
    ============================== */

    function closeModal() {

        document.getElementById(
            "roleModal"
        ).style.display =
            "none";

    }


    /* ==============================
       SAVE ROLE
    ============================== */

    document.getElementById(
        "roleForm"
    ).addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const mode =
                this.dataset.mode;


            const roleName =
                document.getElementById(
                    "roleName"
                ).value.trim();


            if (!roleName) {

                showMessage(
                    "Role name is required.",
                    "error"
                );

                return;

            }


            try {

                if (mode === "create") {

                    await apiRequest(
                        "/roles/",
                        {
                            method: "POST",

                            body:
                                JSON.stringify({
                                    name: roleName
                                })
                        }
                    );


                    showMessage(
                        "Role created successfully.",
                        "success"
                    );

                }


                else if (mode === "edit") {

                    const roleId =
                        this.dataset.roleId;


                    await apiRequest(
                        `/roles/${roleId}`,
                        {
                            method: "PUT",

                            body:
                                JSON.stringify({
                                    name: roleName
                                })
                        }
                    );


                    showMessage(
                        "Role updated successfully.",
                        "success"
                    );

                }


                closeModal();

                loadRoles();

            }

            catch (error) {

                showMessage(
                    error.message,
                    "error"
                );

            }

        }
    );


    /* ==============================
       DELETE ROLE
    ============================== */

    async function deleteRole(roleId) {

        const confirmed =
            confirm(
                "Are you sure you want to delete this role?"
            );


        if (!confirmed) {

            return;

        }


        try {

            await apiRequest(
                `/roles/${roleId}`,
                {
                    method: "DELETE"
                }
            );


            showMessage(
                "Role deleted successfully.",
                "success"
            );


            loadRoles();

        }

        catch (error) {

            showMessage(
                error.message,
                "error"
            );

        }

    }


    /* ==============================
       MESSAGE
    ============================== */

    function showMessage(
        message,
        type
    ) {

        const messageBox =
            document.getElementById(
                "message"
            );


        messageBox.textContent =
            message;


        messageBox.className =
            "message " + type;


        messageBox.style.display =
            "block";


        setTimeout(() => {

            messageBox.style.display =
                "none";

        }, 3000);

    }


    /* ==============================
       LOGOUT
    ============================== */

    function logout() {

        localStorage.removeItem(
            "access_token"
        );

        localStorage.removeItem(
            "username"
        );

        localStorage.removeItem(
            "role"
        );

        localStorage.removeItem(
            "role_id"
        );

        window.location.href =
            "/login";

    }


    /* ==============================
       INITIAL LOAD
    ============================== */

    loadRoles();

</script>

</body>
</html>
