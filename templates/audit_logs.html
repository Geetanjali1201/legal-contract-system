<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Audit Logs</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 240px;
            background: #1f2937;
            color: white;
            padding: 20px;
            min-height: 100vh;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 12px;
            margin-bottom: 5px;
            border-radius: 6px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: #374151;
        }

        .logout {
            margin-top: 25px;
            background: #dc2626 !important;
            text-align: center;
        }

        .main {
            flex: 1;
            padding: 30px;
        }

        .header {
            margin-bottom: 25px;
        }

        .header h1 {
            color: #111827;
            margin-bottom: 8px;
        }

        .header p {
            color: #6b7280;
        }

        .table-container {
            background: white;
            border-radius: 10px;
            overflow-x: auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #f9fafb;
            color: #374151;
        }

        td {
            color: #4b5563;
        }

        .action {
            background: #dbeafe;
            color: #1d4ed8;
            padding: 5px 10px;
            border-radius: 15px;
            font-weight: bold;
        }

        .message {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 6px;
            display: none;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #6b7280;
        }

    </style>

</head>


<body>


    <!-- Sidebar -->

    <div class="sidebar">

        <h2>Legal Contract</h2>

        <a href="/dashboard">
            🏠 Dashboard
        </a>

        <a href="/contracts-page">
            📄 Contracts
        </a>

        <a href="/documents-page">
            📁 Documents
        </a>

        <a href="/users-page" id="usersLink">
            👥 Users
        </a>

        <a href="/roles-page" id="rolesLink">
            🔐 Roles
        </a>

        <a href="/approval-page">
            ✅ Approval
        </a>

        <a href="/modifications-page">
            📝 Modifications
        </a>

        <a href="/version-history-page">
            🔄 Version History
        </a>

        <a href="/audit-logs-page" class="active">
            📋 Audit Logs
        </a>

        <a href="#" class="logout" onclick="logout()">
            🚪 Logout
        </a>

    </div>


    <!-- Main -->

    <div class="main">

        <div class="header">

            <h1>Audit Logs</h1>

            <p>
                View system activities and important actions performed by users.
            </p>

        </div>


        <div id="message" class="message"></div>


        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Action</th>

                        <th>Description</th>

                        <th>User ID</th>

                        <th>Date & Time</th>

                    </tr>

                </thead>


                <tbody id="auditTable">

                    <tr>

                        <td colspan="5" class="empty">
                            Loading audit logs...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>


    <script>

        const token =
            localStorage.getItem("access_token");

        const roleId =
            localStorage.getItem("role_id");


        if (!token) {

            window.location.href = "/login";

        }


        // Users and Roles only for Admin
        // and Role Management

        if (roleId !== "2" && roleId !== "4") {

            document.getElementById("usersLink").style.display =
                "none";

            document.getElementById("rolesLink").style.display =
                "none";

        }


        async function loadAuditLogs() {

            const table =
                document.getElementById("auditTable");

            try {

                const response = await fetch(
                    "/audit-logs/",
                    {
                        method: "GET",

                        headers: {
                            "Authorization":
                                `Bearer ${token}`
                        }
                    }
                );


                if (response.status === 401) {

                    localStorage.clear();

                    window.location.href = "/login";

                    return;

                }


                if (!response.ok) {

                    const errorData =
                        await response.json();

                    throw new Error(
                        errorData.detail ||
                        "Failed to load audit logs."
                    );

                }


                const logs =
                    await response.json();


                if (logs.length === 0) {

                    table.innerHTML = `

                        <tr>

                            <td colspan="5" class="empty">

                                No audit logs found.

                            </td>

                        </tr>

                    `;

                    return;

                }


                table.innerHTML = "";


                logs.forEach(log => {

                    const row =
                        document.createElement("tr");


                    row.innerHTML = `

                        <td>
                            ${log.id}
                        </td>

                        <td>
                            <span class="action">
                                ${log.action}
                            </span>
                        </td>

                        <td>
                            ${log.description || "No description"}
                        </td>

                        <td>
                            ${log.user_id || "N/A"}
                        </td>

                        <td>
                            ${formatDate(log.created_at)}
                        </td>

                    `;


                    table.appendChild(row);

                });


                showMessage(
                    "Audit logs loaded successfully.",
                    "success"
                );

            }

            catch (error) {

                table.innerHTML = `

                    <tr>

                        <td colspan="5" class="empty">

                            Unable to load audit logs.

                        </td>

                    </tr>

                `;

                showMessage(
                    error.message,
                    "error"
                );

            }

        }


        function formatDate(dateString) {

            const date =
                new Date(dateString);

            return date.toLocaleString();

        }


        function showMessage(text, type) {

            const message =
                document.getElementById("message");

            message.textContent = text;

            message.className =
                `message ${type}`;

            message.style.display = "block";

        }


        function logout() {

            localStorage.removeItem("access_token");

            localStorage.removeItem("username");

            localStorage.removeItem("role_id");

            window.location.href = "/login";

        }


        // Load logs automatically

        loadAuditLogs();

    </script>


</body>

</html>
