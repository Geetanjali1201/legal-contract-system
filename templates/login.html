<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Legal Contract System</title>

    <link rel="stylesheet" href="/static/style.css">

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }


        .login-container {

            width: 400px;

            background: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.10);
        }


        .login-header {

            text-align: center;

            margin-bottom: 30px;
        }


        .login-logo {

            font-size: 45px;

            margin-bottom: 10px;
        }


        .login-header h1 {

            margin: 0;

            font-size: 25px;

            color: #172033;
        }


        .login-header p {

            color: #777;

            font-size: 14px;

            margin-top: 8px;
        }


        .form-group {

            margin-bottom: 20px;
        }


        .form-group label {

            display: block;

            margin-bottom: 8px;

            font-weight: bold;

            color: #333;

            font-size: 14px;
        }


        .form-group input {

            width: 100%;

            padding: 13px;

            border: 1px solid #ddd;

            border-radius: 8px;

            font-size: 14px;

            box-sizing: border-box;

            outline: none;
        }


        .form-group input:focus {

            border-color: #172033;
        }


        .login-button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #172033;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }


        .login-button:hover {

            background: #2f3d58;
        }


        .error-message {

            display: none;

            background: #ffe5e5;

            color: #c62828;

            padding: 10px;

            border-radius: 7px;

            margin-bottom: 20px;

            font-size: 14px;

            text-align: center;
        }


        .system-info {

            text-align: center;

            margin-top: 25px;

            color: #888;

            font-size: 12px;
        }

    </style>

</head>


<body>


    <div class="login-container">


        <!-- Login Header -->

        <div class="login-header">

            <div class="login-logo">
                ⚖️
            </div>

            <h1>
                Legal Contract System
            </h1>

            <p>
                Login to your account
            </p>

        </div>


        <!-- Error Message -->

        <div
            id="errorMessage"
            class="error-message">
        </div>


        <!-- Login Form -->

        <form id="loginForm">


            <!-- Username -->

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    required>

            </div>


            <!-- Password -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required>

            </div>


            <!-- Login Button -->

            <button
                type="submit"
                class="login-button">

                Login

            </button>


        </form>


        <div class="system-info">

            Legal Contract Document Modification System

        </div>


    </div>


    <script>


        // Login Form Submit

        document
            .getElementById("loginForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();


                const username =
                    document
                        .getElementById("username")
                        .value;


                const password =
                    document
                        .getElementById("password")
                        .value;


                const errorMessage =
                    document
                        .getElementById("errorMessage");


                try {


                    // Call FastAPI Login API

                    const response =
                        await fetch("/users/login", {

                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({

                                username: username,

                                password: password

                            })

                        });


                    const data =
                        await response.json();


                    // Login Failed

                    if (!response.ok) {

                        errorMessage.style.display = "block";

                        errorMessage.textContent =
                            data.detail ||
                            "Invalid username or password";

                        return;
                    }


                    // Store JWT Token

                    localStorage.setItem(
                        "access_token",
                        data.access_token
                    );


                    // Store Username

                    localStorage.setItem(
                        "username",
                        username
                    );


                    // Get User Profile

                    const profileResponse =
                        await fetch("/users/me", {

                            method: "GET",

                            headers: {

                                "Authorization":
                                    "Bearer " +
                                    data.access_token

                            }

                        });


                    const profile =
                        await profileResponse.json();


                    // Store Role ID

                    localStorage.setItem(
                        "role_id",
                        profile.role_id
                    );


                    // Redirect to Dashboard

                    window.location.href =
                        "/dashboard";


                }
                catch (error) {


                    errorMessage.style.display = "block";

                    errorMessage.textContent =
                        "Server connection failed";


                    console.error(error);

                }

            });


    </script>


</body>

</html>
