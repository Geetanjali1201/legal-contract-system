<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Users - Legal Contract System</title>

    <link rel="stylesheet" href="/static/style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        /* SIDEBAR */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 250px;
            height: 100vh;
            background: #172033;
            color: white;
            z-index: 1000;
        }

        .sidebar-header {
            padding: 20px;
            text-align: left;
        }

        .sidebar-header h2 {
            margin: 0;
            font-size: 22px;
            color: white;
        }

        .sidebar-header p {
            margin: 5px 0 0;
            color: #d1d5db;
            font-size: 14px;
        }

        .sidebar-menu {
            list-style: none;
            padding: 0;
            margin: 10px 0 0;
        }

        .sidebar-menu li {
            margin: 0;
            padding: 0;
        }

        .sidebar-menu li a {
            display: block;
            padding: 12px 20px;
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        .sidebar-menu li a:hover {
            background: rgba(255, 255, 255, 0.10);
            color: white;
        }

        .sidebar-menu li.active a {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            font-weight: 600;
        }

        .sidebar-bottom {
            position: absolute;
            bottom: 20px;
            left: 15px;
            right: 15px;
        }

        .sidebar-bottom button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            background: #dc2626;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        .sidebar-bottom button:hover {
            background: #b91c1c;
        }

        /* MAIN CONTENT */

        .main-content {
            margin-left: 250px;
            min-height: 100vh;
        }

        .topbar {
            background: white;
            padding: 18px 30px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .topbar h1 {
            margin: 0;
            font-size: 24px;
        }

        .user-info {
            text-align: right;
        }

        .user-info strong {
            display: block;
        }

        .user-info span {
            color: #6b7280;
            font-size: 13px;
        }

        .content {
            padding: 30px;
        }

        /* PAGE HEADER */

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .page-header h2 {
            margin: 0;
        }

        .page-header p {
            margin: 6px 0 0;
            color: #6b7280;
        }

        .btn {
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-edit {
            background: #f59e0b;
            color: white;
            padding: 7px 12px;
        }

        .btn-delete {
            background: #dc2626;
            color: white;
            padding: 7px 12px;
            margin-left: 5px;
        }

        /* TABLE */

        .table-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 13px 12px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
        }

        th {
            background: #f8fafc;
            font-size: 14px;
        }

        td {
            font-size: 14px;
        }

        .status-active {
            color: #15803d;
            font-weight: 600;
        }

        .status-inactive {
            color: #dc2626;
            font-weight: 600;
        }

        .empty-message {
            text-align: center;
            padding: 30px;
            color: #6b7280;
        }

        /* MODAL */

        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.45);
        }

        .modal-content {
            background: white;
            width: 450px;
            max-width: 90%;
            margin: 70px auto;
            padding: 25px;
            border-radius: 10px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            margin: 0;
        }

        .close {
            font-size: 25px;
            cursor: pointer;
            color: #6b7280;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 600;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #2563eb;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-cancel {
            background: #6b7280;
            color: white;
        }

        .message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 210px;
            }

            .main-content {
                margin-left: 210px;
            }

            .content {
                padding: 20px;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
        }
    </style>
</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

    <div class="sidebar-header">
        <h2>Legal Contract</h2>
        <p>Document System</p>
    </div>

    <ul class="sidebar-menu">

        <li>
            <a href="/dashboard">Dashboard</a>
        </li>

        <li>
            <a href="/contracts-page">Contracts</a>
        </li>

        <li>
            <a href="/documents-page">Documents</a>
        </li>

        <li class="active">
            <a href="/users-page">Users</a>
        </li>

        <li id="rolesMenu">
            <a href="#">Roles</a>
        </li>

        <li id="approvalMenu">
            <a href="#">Approval</a>
        </li>

    </ul>

    <div class="sidebar-bottom">
        <button onclick="logout()">Logout</button>
    </div>

</div>


<!-- MAIN CONTENT -->

<div class="main-content">

    <div class="topbar">

        <div>
            <h1>User Management</h1>
        </div>

        <div class="user-info">
            <strong id="loggedUsername">User</strong>
            <span id="loggedRole">Role</span>
        </div>

    </div>


    <div class="content">

        <div class="page-header">

            <div>
                <h2>Users</h2>
                <p>Manage system users and their roles.</p>
            </div>

            <button
                class="btn btn-primary"
                onclick="openCreateModal()">
                + Create User
            </button>

        </div>


        <div id="message" class="message"></div>


        <div class="table-card">

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Full Name</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>

                </thead>

                <tbody id="usersTableBody">

                    <tr>
                        <td colspan="6" class="empty-message">
                            Loading users...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>


<!-- CREATE / EDIT MODAL -->

<div id="userModal" class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h2 id="modalTitle">Create User</h2>

            <span
                class="close"
                onclick="closeModal()">
                &times;
            </span>

        </div>


        <form id="userForm">

            <div class="form-group">

                <label>Username</label>

                <input
                    type="text"
                    id="username"
                    required>

            </div>


            <div
                class="form-group"
                id="passwordGroup">

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    required>

            </div>


            <div class="form-group">

                <label>Full Name</label>

                <input
                    type="text"
                    id="fullName"
                    required>

            </div>


            <div class="form-group">

                <label>Role</label>

                <select id="roleId" required>

                    <option value="">
                        Select Role
                    </option>

                </select>

            </div>


            <div
                class="form-group"
                id="statusGroup">

                <label>Status</label>

                <select id="isActive">

                    <option value="true">
                        Active
                    </option>

                    <option value="false">
                        Inactive
                    </option>

                </select>

            </div>


            <div class="form-actions">

                <button
                    type="button"
                    class="btn btn-cancel"
                    onclick="closeModal()">
                    Cancel
                </button>

                <button
                    type="submit"
                    class="btn btn-primary">
                    Save User
                </button>

            </div>

        </form>

    </div>

</div>


<script>

    /* ==============================
       LOGIN CHECK
    ============================== */

    const token = localStorage.getItem("access_token");

    if (!token) {

        window.location.href = "/login";

    }


    /* ==============================
       USER INFO
    ============================== */

    const username =
        localStorage.getItem("username") || "User";

    const roleId =
        Number(localStorage.getItem("role_id"));

    document.getElementById("loggedUsername")
        .textContent = username;


    /* ==============================
       ROLE NAMES
    ============================== */

    const roleNames = {

        2: "Admin",
        3: "Approval",
        4: "Role Management",
        5: "Reviewer"

    };

    document.getElementById("loggedRole")
        .textContent = roleNames[roleId] || "Role";


    /* ==============================
       ACCESS CONTROL
    ============================== */

    if (roleId !== 2 && roleId !== 4) {

        alert(
            "Access denied. Only Admin and Role Management can access Users."
        );

        window.location.href = "/dashboard";

    }


    /* ==============================
       SIDEBAR ROLE MENU
    ============================== */

    const rolesMenu =
        document.getElementById("rolesMenu");

    const approvalMenu =
        document.getElementById("approvalMenu");


    if (roleId === 2 || roleId === 4) {

        rolesMenu.innerHTML =
            '<a href="/roles-page">Roles</a>';

    }


    if (roleId === 2 || roleId === 3) {

        approvalMenu.innerHTML =
            '<a href="/approval-page">Approval</a>';

    }


    /* ==============================
       API HELPER
    ============================== */

    async function apiRequest(
        url,
        options = {}
    ) {

        options.headers = {

            "Content-Type":
                "application/json",

            "Authorization":
                "Bearer " + token,

            ...(options.headers || {})

        };

        const response =
            await fetch(url, options);

        if (response.status === 401) {

            localStorage.clear();

            window.location.href =
                "/login";

            return null;

        }

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.detail ||
                "Something went wrong"
            );

        }

        return data;

    }


    /* ==============================
       LOAD USERS
    ============================== */

    async function loadUsers() {

        const tableBody =
            document.getElementById(
                "usersTableBody"
            );

        try {

            const users =
                await apiRequest("/users/");

            tableBody.innerHTML = "";

            if (!users || users.length === 0) {

                tableBody.innerHTML = `
                    <tr>
                        <td colspan="6"
                            class="empty-message">
                            No users found.
                        </td>
                    </tr>
                `;

                return;

            }


            users.forEach(user => {

                const roleName =
                    roleNames[user.role_id] ||
                    "Unknown";


                const statusHTML =
                    user.is_active

                    ? `<span class="status-active">
                         Active
                       </span>`

                    : `<span class="status-inactive">
                         Inactive
                       </span>`;


                tableBody.innerHTML += `

                    <tr>

                        <td>${user.id}</td>

                        <td>${user.username}</td>

                        <td>${user.full_name}</td>

                        <td>${roleName}</td>

                        <td>${statusHTML}</td>

                        <td>

                            <button
                                class="btn btn-edit"
                                onclick='editUser(${JSON.stringify(user)})'>
                                Edit
                            </button>

                            <button
                                class="btn btn-delete"
                                onclick="deleteUser(${user.id})">
                                Delete
                            </button>

                        </td>

                    </tr>

                `;

            });

        }

        catch (error) {

            showMessage(
                error.message,
                "error"
            );

        }

    }


    /* ==============================
       LOAD ROLES
    ============================== */

    async function loadRoles() {

        const roleSelect =
            document.getElementById(
                "roleId"
            );

        try {

            const roles =
                await apiRequest("/roles/");

            roleSelect.innerHTML =
                '<option value="">Select Role</option>';

            roles.forEach(role => {

                roleSelect.innerHTML += `

                    <option value="${role.id}">
                        ${role.name}
                    </option>

                `;

            });

        }

        catch (error) {

            showMessage(
                error.message,
                "error"
            );

        }

    }


    /* ==============================
       CREATE MODAL
    ============================== */

    function openCreateModal() {

        document.getElementById(
            "modalTitle"
        ).textContent =
            "Create User";


        document.getElementById(
            "userForm"
        ).reset();


        document.getElementById(
            "username"
        ).disabled = false;


        document.getElementById(
            "passwordGroup"
        ).style.display = "block";


        document.getElementById(
            "password"
        ).required = true;


        document.getElementById(
            "statusGroup"
        ).style.display = "none";


        document.getElementById(
            "userModal"
        ).style.display = "block";


        document.getElementById(
            "userForm"
        ).dataset.mode = "create";

    }


    /* ==============================
       EDIT USER
    ============================== */

    function editUser(user) {

        document.getElementById(
            "modalTitle"
        ).textContent =
            "Edit User";


        document.getElementById(
            "username"
        ).value =
            user.username;


        document.getElementById(
            "username"
        ).disabled = true;


        document.getElementById(
            "passwordGroup"
        ).style.display = "none";


        document.getElementById(
            "password"
        ).required = false;


        document.getElementById(
            "fullName"
        ).value =
            user.full_name;


        document.getElementById(
            "roleId"
        ).value =
            user.role_id;


        document.getElementById(
            "isActive"
        ).value =
            String(user.is_active);


        document.getElementById(
            "statusGroup"
        ).style.display = "block";


        document.getElementById(
            "userModal"
        ).style.display = "block";


        document.getElementById(
            "userForm"
        ).dataset.mode = "edit";

        document.getElementById(
            "userForm"
        ).dataset.userId =
            user.id;

    }


    /* ==============================
       CLOSE MODAL
    ============================== */

    function closeModal() {

        document.getElementById(
            "userModal"
        ).style.display = "none";

    }


    /* ==============================
       SAVE USER
    ============================== */

    document.getElementById(
        "userForm"
    ).addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const mode =
                this.dataset.mode;


            try {

                if (mode === "create") {

                    const userData = {

                        username:
                            document.getElementById(
                                "username"
                            ).value,

                        password:
                            document.getElementById(
                                "password"
                            ).value,

                        full_name:
                            document.getElementById(
                                "fullName"
                            ).value,

                        role_id:
                            Number(
                                document.getElementById(
                                    "roleId"
                                ).value
                            )

                    };


                    await apiRequest(
                        "/users/",
                        {
                            method: "POST",
                            body:
                                JSON.stringify(
                                    userData
                                )
                        }
                    );


                    showMessage(
                        "User created successfully.",
                        "success"
                    );

                }


                else if (mode === "edit") {

                    const userId =
                        this.dataset.userId;


                    const userData = {

                        full_name:
                            document.getElementById(
                                "fullName"
                            ).value,

                        role_id:
                            Number(
                                document.getElementById(
                                    "roleId"
                                ).value
                            ),

                        is_active:
                            document.getElementById(
                                "isActive"
                            ).value === "true"

                    };


                    await apiRequest(
                        `/users/${userId}`,
                        {
                            method: "PUT",
                            body:
                                JSON.stringify(
                                    userData
                                )
                        }
                    );


                    showMessage(
                        "User updated successfully.",
                        "success"
                    );

                }


                closeModal();

                loadUsers();

            }

            catch (error) {

                showMessage(
                    error.message,
                    "error"
                );

            }

        }
    );


    /* ==============================
       DELETE USER
    ============================== */

    async function deleteUser(userId) {

        const confirmed =
            confirm(
                "Are you sure you want to delete this user?"
            );


        if (!confirmed) {

            return;

        }


        try {

            await apiRequest(
                `/users/${userId}`,
                {
                    method: "DELETE"
                }
            );


            showMessage(
                "User deleted successfully.",
                "success"
            );


            loadUsers();

        }

        catch (error) {

            showMessage(
                error.message,
                "error"
            );

        }

    }


    /* ==============================
       MESSAGE
    ============================== */

    function showMessage(
        message,
        type
    ) {

        const messageBox =
            document.getElementById(
                "message"
            );


        messageBox.textContent =
            message;


        messageBox.className =
            "message " + type;


        messageBox.style.display =
            "block";


        setTimeout(() => {

            messageBox.style.display =
                "none";

        }, 3000);

    }


    /* ==============================
       LOGOUT
    ============================== */

    function logout() {

        localStorage.removeItem(
            "access_token"
        );

        localStorage.removeItem(
            "username"
        );

        localStorage.removeItem(
            "role"
        );

        localStorage.removeItem(
            "role_id"
        );

        window.location.href =
            "/login";

    }


    /* ==============================
       INITIAL LOAD
    ============================== */

    loadRoles();
    loadUsers();

</script>

</body>
</html>
